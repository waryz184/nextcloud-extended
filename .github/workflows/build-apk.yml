name: Build APK and AAB

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and attach the artifacts to (e.g. v1.0.2)"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > keystore.jks
          cat > keystore.properties <<EOF
          storeFile=keystore.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build signed release APK and AAB
        run: ./gradlew assembleRelease bundleRelease

      - name: Upload signed APK and AAB to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk NextcloudExtended.apk
          cp app/build/outputs/bundle/release/app-release.aab NextcloudExtended.aab
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||             gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag               --title "$TAG" --notes "Release $TAG"
          gh release upload "$TAG" NextcloudExtended.apk NextcloudExtended.aab             --clobber --repo "$GITHUB_REPOSITORY"
          sha256sum NextcloudExtended.apk NextcloudExtended.aab
